    <form>
        <label for="nom">Nom : </label>
        <input type="text" id="nom" name="nom">
        <br><br>
        <label for="postnom">Post Nom : </label>
        <input type="text" id="postnom" name="postnom">
        <br><br>
        <label for="prenom">Prenom : </label>
        <input type="text" id="prenom" name="prenom">
        <br><br>
        <label for="email">E-mail : </label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="age">Age : </label>
        <input type="number" id="age" name="age">
        <br><br>
        <label for="telephone">Telephone : </label>
        <input type="tel" id="telephone" name="telephone">
        <br><br>
        <label for="password">Mot de passe : </label>
        <input type="password" id="password" name="password">
        <br><br>
        <label for="date">Date de naissance : </label>
        <input type="date" id="date" name="date">
        <br><br>
        <label for="heure">Heure : </label>
        <input type="time" id="heure" name="heure">
        <br><br>
        <label for="dateheure">Date et Heure : </label>
        <input type="datetime-local" id="dateheure" name="dateheure">
        <br><br>
        <label for="couleur">Couleur : </label>
        <input type="color" id="couleur" name="couleur">
        <br><br>
        <label for="fichier">Fichier : </label>
        <input type="file" id="fichier" name="fichier">
        <br><br>
        <label>
            <input type="radio" name="sexe" value="masculin"> Masculin
        </label>
        <label>
            <input type="radio" name="sexe" value="feminin" checked> Féminin
        </label>
        <br><br>
        <!-- <label>
            <input type="checkbox" name="newsletter" value="oui">J'accepte le contact de licence du logiciel
        </label> -->
        <label>
            <input type="checkbox" name="langages" value="html"> HTML
        </label>
        <label>
            <input type="checkbox" name="langages" value="css" checked> CSS
        </label>
        <label>
            <input type="checkbox" name="langages" value="javascript" checked> JavaScript
        </label>
        <label>
            <input type="checkbox" name="langages" value="php"> PHP
        </label>
        <br><br>
        <label for="message">Message : </label>
        <textarea id="message" name="message" rows="6" cols="40"></textarea>
    </form>
</body>
